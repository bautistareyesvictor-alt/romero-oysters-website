<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10233d">
  <title>Página no encontrada | Romero Oysters</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #10233d; color: #faf7f1; font-family: system-ui, sans-serif; text-align: center; }
    main { max-width: 640px; }
    img { width: min(280px, 75vw); filter: brightness(0) invert(1); }
    h1 { margin: 28px 0 12px; font-family: Georgia, serif; font-size: clamp(34px, 8vw, 62px); }
    p { color: #c3cad6; line-height: 1.6; }
    a { display: inline-block; margin-top: 18px; padding: 14px 24px; background: #c9a869; color: #10233d; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo-transparent.png" alt="Romero Oysters">
    <h1>Página no encontrada</h1>
    <p>La dirección que visitaste no está disponible. Regresa al inicio para conocer nuestro producto y solicitar información comercial.</p>
    <a href="/">VOLVER AL INICIO</a>
  </main>
</body>
</html>
